spring.application.name=book-processing

# Port Configuration (Required for Railway)
server.port=${PORT:8080}

# Database Configuration (Ensure the Railway variable starts with jdbc:)
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Virtual Threads
spring.threads.virtual.enabled=true

# AI Configuration
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite-preview

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}