syntax = "proto3";

package books.v1;

option java_multiple_files = true;
option java_package = "com.orio.proto.books";
option java_outer_classname = "BooksProto";

// Exposed by books-service. Consumed by processing-service for
// chapter/sentence reads and for claiming/finalizing queued jobs.
service BooksService {

  // Chapter data (input for LLM workflows)
  rpc GetChapterText(ChapterRequest) returns (ChapterTextResponse);
  rpc GetChapterSentences(ChapterRequest) returns (stream Sentence);
  rpc GetSentencesByIds(SentenceIdsRequest) returns (stream Sentence);

  // PostgreSQL-backed job queue
  rpc ClaimNextJob(ClaimJobRequest) returns (ClaimJobResponse);
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse);
}

message ChapterRequest {
  int64 chapter_id = 1;
  int64 user_id = 2;
}

message ChapterTextResponse {
  int64 chapter_id = 1;
  string title = 2;
  string text = 3;
}

message Sentence {
  int64 id = 1;
  int64 chapter_id = 2;
  int32 sentence_index = 3;
  int32 page_num = 4;
  string content = 5;
}

message SentenceIdsRequest {
  repeated int64 sentence_ids = 1;
  int64 user_id = 2;
}

// Job type / status values mirror the JobType / JobStatus enums of
// books-service (e.g. CHAPTER_SUMMARY, CHAT, IDEA_EXTRACTION, ...).
message ClaimJobRequest {
  repeated string types = 1;
}

message ClaimJobResponse {
  bool job_available = 1;
  int64 job_id = 2;
  string type = 3;
  string payload = 4;
  int64 user_id = 5;
}

message CompleteJobRequest {
  int64 job_id = 1;
  string status = 2;      // COMPLETED or FAILED
  int64 result_id = 3;    // 0 = none
  string error_text = 4;  // empty = none
}

message CompleteJobResponse {
  bool ok = 1;
}
