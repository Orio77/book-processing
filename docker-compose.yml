services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: BookProcessing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/eureka/apps || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/BookProcessing
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-mypass}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:*}
      - SECURITY_JWT_SECRET=${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-characters}
      - SECURITY_JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  books-service:
    build:
      context: ./books-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
      - "9090:9090"
    environment:
      - SERVER_PORT=8080
      - GRPC_SERVER_PORT=9090
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/BookProcessing
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-mypass}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:*}
      - SECURITY_JWT_SECRET=${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-characters}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  processing-service:
    build:
      context: ./processing-service
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/BookProcessing
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-mypass}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:*}
      - SECURITY_JWT_SECRET=${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-characters}
      - BOOKS_GRPC_HOST=books-service
      - BOOKS_GRPC_PORT=9090
      - SPRING_AI_MODEL_CHAT=${AI_MODEL:-google-genai}
      - SPRING_AI_GOOGLE_GENAI_API_KEY=${GEMINI_API_KEY:-}
      - SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      books-service:
        condition: service_started

volumes:
  postgres-data:
